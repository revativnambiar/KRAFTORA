<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta http-equiv="refresh" content="0; url=shop.html"/>
  <title>Redirecting to Shop — KRAFTORA</title>
  <link rel="stylesheet" href="css/style.css"/>
  <script>window.location.replace("shop.html");</script>
</head>
<body class="bg-cream" style="display:flex; align-items:center; justify-content:center; min-height:100vh; text-align:center; padding:var(--s-6);">
  <div style="max-width:480px; background:var(--white); padding:var(--s-10) var(--s-8); border-radius:var(--r-md); border:1px solid var(--border); box-shadow:var(--shadow-md);">
    <img src="images/kraftora-logo.png" alt="KRAFTORA — Sustainable Packaging. Elevated Style." class="conf-logo-img" width="113" height="64" style="margin:0 auto var(--s-6); display:block;"/>
    <h1 class="subsection-heading mb-3">Direct Buy Now System</h1>
    <p style="color:var(--text-light); margin-bottom:var(--s-6); font-size:0.95rem; line-height:1.6;">
      At KRAFTORA, we do not require a shopping cart. Select your desired bag size and click <strong>Buy Now</strong> for instant checkout.
    </p>
    <a href="shop.html" class="btn btn--primary btn--lg">Proceed to Shop</a>
  </div>
</body>
</html>
