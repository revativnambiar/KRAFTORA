<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" width="480" height="480">
  <defs>
    <pattern id="fabric-a" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="0" y1="4" x2="8" y2="4" stroke="#2C4F72" stroke-width="0.5" opacity="0.4"/>
      <line x1="4" y1="0" x2="4" y2="8" stroke="#2C4F72" stroke-width="0.3" opacity="0.25"/>
    </pattern>
    <pattern id="paper-a" x="0" y="0" width="2" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="480" y2="3" stroke="#A87845" stroke-width="0.4" opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="480" height="480" fill="#FAF7F2"/>

  <!-- === LEFT SIDE: KRAFT PAPER BAG (outer) === -->
  <!-- Drop shadow left -->
  <ellipse cx="125" cy="455" rx="90" ry="10" fill="rgba(0,0,0,0.07)"/>
  
  <!-- Bag body -->
  <rect x="22" y="120" width="208" height="325" rx="2" fill="#C4976A"/>
  <rect x="22" y="120" width="208" height="325" rx="2" fill="url(#paper-a)"/>
  <rect x="22" y="120" width="208" height="325" rx="2" fill="none" stroke="#A07545" stroke-width="1" opacity="0.5"/>
  
  <!-- Bag top open rim -->
  <rect x="22" y="112" width="208" height="12" rx="1" fill="#B88A5A" opacity="0.6"/>
  
  <!-- Left handle on bag -->
  <path d="M 62 122 C 62 72 92 55 108 55 C 124 55 124 72 124 122"
        fill="none" stroke="#7A5530" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M 65 122 C 65 75 93 58 109 58 C 123 58 123 75 123 122"
        fill="none" stroke="#A07A50" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Right handle on bag -->
  <path d="M 128 122 C 128 72 158 55 174 55 C 190 55 190 72 190 122"
        fill="none" stroke="#7A5530" stroke-width="7" stroke-linecap="round" opacity="0.9"/>
  <path d="M 131 122 C 131 75 159 58 175 58 C 189 58 189 75 188 122"
        fill="none" stroke="#A07A50" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Label: KRAFT PAPER BAG -->
  <text x="126" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#8A6540" letter-spacing="1">KRAFT PAPER BAG</text>
  <line x1="60" y1="468" x2="192" y2="468" stroke="#C4976A" stroke-width="0.8" opacity="0.6"/>

  <!-- === ARROW between the two components === -->
  <line x1="242" y1="260" x2="258" y2="260" stroke="#C4976A" stroke-width="1.5" opacity="0.7"/>
  <polygon points="258,255 268,260 258,265" fill="#C4976A" opacity="0.7"/>

  <!-- === RIGHT SIDE: NAVY LINER === -->
  <!-- Drop shadow right -->
  <ellipse cx="358" cy="455" rx="88" ry="10" fill="rgba(0,0,0,0.07)"/>

  <!-- Liner side wall -->
  <polygon points="258,120 234,142 234,448 258,435" fill="#152D48"/>
  <polygon points="466,120 442,142 442,448 466,435" fill="#152D48" opacity="0.75"/>
  
  <!-- Liner bottom -->
  <polygon points="258,435 234,448 466,448 442,435" fill="#122840"/>
  
  <!-- Liner front face -->
  <rect x="258" y="120" width="208" height="315" rx="1" fill="#1B3A5A"/>
  <rect x="258" y="120" width="208" height="315" rx="1" fill="url(#fabric-a)"/>
  <rect x="258" y="120" width="208" height="315" rx="1" fill="none" stroke="#152D48" stroke-width="1" opacity="0.5"/>
  
  <!-- Liner top fold edge -->
  <rect x="258" y="108" width="208" height="16" rx="1" fill="#224E7A"/>
  <rect x="258" y="108" width="208" height="4" rx="1" fill="#3060A0" opacity="0.5"/>
  
  <!-- Stitch line -->
  <line x1="260" y1="122" x2="464" y2="122" stroke="#264D74" stroke-width="0.6" stroke-dasharray="5,4" opacity="0.6"/>
  <line x1="260" y1="433" x2="464" y2="433" stroke="#264D74" stroke-width="0.6" stroke-dasharray="5,4" opacity="0.5"/>
  
  <!-- Label: REMOVABLE LINER -->
  <text x="362" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#2A5080" letter-spacing="1">REMOVABLE LINER</text>
  <line x1="295" y1="468" x2="429" y2="468" stroke="#1B3A5A" stroke-width="0.8" opacity="0.6"/>

  <!-- Page title -->
  <text x="240" y="30" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#4A4A4A" letter-spacing="2" opacity="0.6">TWO-COMPONENT DESIGN</text>
</svg>

